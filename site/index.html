<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>M+ EU Cutoffs — Season Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   TOKENS — premium dark-on-light, Samsung-inspired with cinematic hero
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  --white:#ffffff; --off:#fafafa; --subtle:#f4f4f5;
  --border:#e6e6e9; --border2:#d4d4d8;
  --ink:#0c0c0f; --ink2:#17171c;
  --text:#1a1a1f; --muted:#71717a; --dim:#b3b3bb;
  --blue:#1428A0; --blue-hi:#2a44d4; --blue-glow:rgba(20,40,160,.25);
  --achieved:#0d7a3e; --gold:#b8860b; --pink:#9b2257;
  --purple:#5e35b1; --orange:#bf5800; --green:#1b6b3a;
  --lime:#5a7a00; --red:#c0392b;
  --nav-h:64px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --display:'Space Grotesk','Inter',sans-serif;
  --shadow-sm:0 1px 3px rgba(0,0,0,.06);
  --shadow-md:0 8px 30px rgba(0,0,0,.10);
  --shadow-lg:0 20px 60px rgba(0,0,0,.18);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--white);color:var(--text);
  -webkit-font-smoothing:antialiased;overflow-x:hidden}

/* ═══════════════════════════════════════════════════════════════════════════
   NAV — transparent over hero → frosted solid on scroll
   ═══════════════════════════════════════════════════════════════════════════ */
nav{position:fixed;inset:0 0 auto;z-index:100;height:var(--nav-h);
  display:flex;align-items:center;
  transition:background .35s,border-color .35s,backdrop-filter .35s}
nav.solid{background:rgba(255,255,255,.88);backdrop-filter:blur(16px) saturate(1.4);
  border-bottom:1px solid var(--border)}
.nav-inner{width:100%;max-width:1360px;margin:0 auto;padding:0 28px;
  display:flex;align-items:center;justify-content:space-between;gap:16px}
.nav-logo{font-family:var(--display);font-size:20px;font-weight:700;
  letter-spacing:-.5px;text-decoration:none;color:#fff;transition:color .35s}
nav.solid .nav-logo{color:var(--text)}
.nav-logo em{font-style:normal;color:var(--blue-hi)}
nav.solid .nav-logo em{color:var(--blue)}
.nav-right{display:flex;align-items:center;gap:18px;font-size:11px}
.nav-season{font-weight:600;letter-spacing:1.2px;text-transform:uppercase;
  color:rgba(255,255,255,.55);transition:color .35s}
nav.solid .nav-season{color:var(--muted)}
.nav-status{color:rgba(255,255,255,.55);transition:color .35s;
  display:flex;align-items:center;gap:6px}
nav.solid .nav-status{color:var(--muted)}

/* ═══════════════════════════════════════════════════════════════════════════
   HERO — cinematic: layered gradients, ambient drift, avatar, parallax
   ═══════════════════════════════════════════════════════════════════════════ */
.hero{position:relative;min-height:74vh;display:flex;align-items:center;
  background:var(--ink);color:#fff;overflow:hidden;
  padding:calc(var(--nav-h) + 40px) 28px 72px}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center 30%;
  opacity:0;transform:scale(1.08);filter:saturate(.85) brightness(.6);
  transition:opacity 1.4s ease,transform 8s ease-out}
.hero-bg.on{opacity:.55;transform:scale(1.0)}
.hero::before{content:"";position:absolute;inset:0;z-index:1;
  background:linear-gradient(160deg,rgba(12,12,15,.92) 0%,rgba(12,12,15,.55) 45%,rgba(20,40,160,.28) 100%)}
.hero::after{content:"";position:absolute;width:70vw;height:70vw;right:-25vw;top:-30vw;
  z-index:1;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(42,68,212,.22),transparent 60%);
  animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(-6vw,4vw) scale(1.12)}}

.hero-inner{position:relative;z-index:2;max-width:1360px;margin:0 auto;width:100%;
  display:flex;align-items:center;gap:44px;flex-wrap:wrap}
.hero-copy{flex:1 1 480px;min-width:0}
.hero-eyebrow{font-size:11px;font-weight:600;letter-spacing:3px;
  text-transform:uppercase;color:rgba(255,255,255,.5);
  opacity:0;transform:translateY(14px);animation:rise .7s .15s forwards}
.hero-score{font-family:var(--display);font-size:clamp(64px,11vw,124px);
  font-weight:700;letter-spacing:-4px;line-height:1;margin:8px 0 2px;
  font-variant-numeric:tabular-nums;
  background:linear-gradient(100deg,#fff 30%,#9db2ff 85%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  opacity:0;transform:translateY(18px);animation:rise .8s .3s forwards}
.hero-meta{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;
  opacity:0;transform:translateY(14px);animation:rise .7s .5s forwards}
.hero-name{font-size:20px;font-weight:700}
.hero-rank{font-size:13px;color:rgba(255,255,255,.5)}
.hero-rule{width:0;height:2px;background:var(--blue-hi);margin-top:22px;
  box-shadow:0 0 18px var(--blue-glow);transition:width 1s cubic-bezier(.2,.7,.3,1)}
@keyframes rise{to{opacity:1;transform:translateY(0)}}

.hero-avatar{flex:0 0 auto;position:relative;
  opacity:0;transform:translateY(20px) scale(.96);animation:rise .8s .55s forwards}
.hero-avatar img{width:148px;height:148px;border-radius:50%;object-fit:cover;
  border:2px solid rgba(255,255,255,.18);
  box-shadow:0 0 0 10px rgba(42,68,212,.10),0 0 50px rgba(42,68,212,.35);
  display:block;background:var(--ink2)}
.avatar-ph{width:148px;height:148px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-size:56px;font-weight:700;color:#9db2ff;
  background:linear-gradient(160deg,#1a2350,#0c0c14);
  border:2px solid rgba(255,255,255,.18);
  box-shadow:0 0 0 10px rgba(42,68,212,.10),0 0 50px rgba(42,68,212,.35)}
.hero-avatar::after{content:"";position:absolute;inset:-14px;border-radius:50%;
  border:1px solid rgba(157,178,255,.25);animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.07);opacity:.2}}

.hero-scroll{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);
  z-index:2;font-size:10px;letter-spacing:2px;text-transform:uppercase;
  color:rgba(255,255,255,.4);display:flex;flex-direction:column;align-items:center;gap:6px}
.hero-scroll::after{content:"";width:1px;height:26px;
  background:linear-gradient(rgba(255,255,255,.5),transparent);
  animation:scrollhint 1.8s ease-in-out infinite}
@keyframes scrollhint{0%{transform:scaleY(0);transform-origin:top}
  50%{transform:scaleY(1);transform-origin:top}
  51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* ═══════════════════════════════════════════════════════════════════════════
   LOOKUP BAND
   ═══════════════════════════════════════════════════════════════════════════ */
.lookup-band{background:var(--white);border-bottom:1px solid var(--border);
  padding:18px 28px;position:relative;z-index:3;box-shadow:var(--shadow-sm)}
.lookup-inner{max-width:1360px;margin:0 auto;display:flex;gap:10px;
  flex-wrap:wrap;align-items:center}
.lookup-label{font-size:11px;font-weight:700;letter-spacing:1.4px;
  color:var(--muted);text-transform:uppercase;margin-right:6px;white-space:nowrap}
.lookup-inner input{flex:1 1 130px;min-width:0;background:var(--off);
  border:1px solid var(--border2);color:var(--text);padding:11px 14px;
  font-size:14px;font-family:var(--font);font-weight:500;border-radius:3px;
  outline:none;transition:border-color .2s,box-shadow .2s,background .2s}
.lookup-inner input:focus{border-color:var(--blue);background:#fff;
  box-shadow:0 0 0 3px rgba(20,40,160,.12)}
.lookup-inner input::placeholder{color:var(--dim);font-weight:400}
.lookup-btn{background:var(--blue);color:#fff;border:none;border-radius:3px;
  padding:11px 26px;font-size:13px;font-weight:700;font-family:var(--font);
  cursor:pointer;white-space:nowrap;letter-spacing:.4px;position:relative;
  overflow:hidden;transition:background .2s,box-shadow .2s,transform .1s}
.lookup-btn:hover{background:var(--blue-hi);box-shadow:0 6px 20px var(--blue-glow)}
.lookup-btn:active{transform:translateY(1px)}
.lookup-btn::after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);
  transform:skewX(-20deg);transition:left .5s}
.lookup-btn:hover::after{left:130%}

/* ═══════════════════════════════════════════════════════════════════════════
   MAIN GRID
   ═══════════════════════════════════════════════════════════════════════════ */
.main{max-width:1360px;margin:0 auto;padding:44px 28px 64px}
.grid-3{display:grid;grid-template-columns:1fr;gap:40px}
@media(min-width:980px){
  .grid-3{grid-template-columns:280px 1fr 280px;gap:28px;align-items:start}
  .col-sticky{position:sticky;top:calc(var(--nav-h) + 20px)}
}
.sec-label{font-family:var(--display);font-size:12px;font-weight:700;
  letter-spacing:2px;color:var(--text);text-transform:uppercase;
  padding-bottom:12px;border-bottom:2px solid var(--ink);margin-bottom:16px;
  display:flex;justify-content:space-between;align-items:baseline}
.sec-label small{font-family:var(--font);font-size:10px;font-weight:500;
  letter-spacing:.5px;color:var(--muted);text-transform:none}

/* scroll reveal */
.reveal{opacity:0;transform:translateY(24px);
  transition:opacity .7s cubic-bezier(.2,.7,.3,1),transform .7s cubic-bezier(.2,.7,.3,1)}
.reveal.in{opacity:1;transform:none}

/* ═══════════════════════════════════════════════════════════════════════════
   CUTOFF CARDS — elevated, hover-lift
   ═══════════════════════════════════════════════════════════════════════════ */
.card{background:var(--white);border:1px solid var(--border);border-radius:6px;
  padding:16px 18px;margin-bottom:12px;position:relative;overflow:hidden;
  transition:transform .25s cubic-bezier(.2,.7,.3,1),box-shadow .25s,border-color .25s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);
  border-color:var(--border2)}
.card-stripe{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--dim);
  transition:background .3s}
.card.achieved .card-stripe{background:var(--achieved)}
.card-body{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.card-label{font-size:15px;font-weight:800;letter-spacing:-.2px}
.card-sub{font-size:11px;color:var(--muted);margin-top:2px}
.card-right{text-align:right;flex-shrink:0}
.card-val{font-family:var(--display);font-size:24px;font-weight:700;
  letter-spacing:-.5px;font-variant-numeric:tabular-nums;color:var(--dim);
  transition:color .4s}
.card-val.loaded{color:var(--text)}
.card-gap{font-size:11px;color:var(--muted);margin-top:2px}
.card-gap.done{color:var(--achieved);font-weight:700}
.bar-wrap{margin-top:12px}
.bar-track{height:5px;background:var(--subtle);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;width:0;border-radius:3px;
  background:linear-gradient(90deg,var(--blue),var(--blue-hi));
  box-shadow:0 0 12px var(--blue-glow);
  transition:width 1.1s cubic-bezier(.2,.7,.3,1)}
.card.achieved .bar-fill{background:var(--achieved);box-shadow:none}
.bar-meta{display:flex;justify-content:space-between;font-size:10px;
  color:var(--muted);margin-top:5px}

/* shimmer skeleton while loading */
.card-val:not(.loaded){position:relative;color:transparent;border-radius:4px;
  background:linear-gradient(90deg,var(--subtle) 25%,var(--border) 50%,var(--subtle) 75%);
  background-size:200% 100%;animation:shimmer 1.4s infinite}
@keyframes shimmer{to{background-position:-200% 0}}

/* ═══════════════════════════════════════════════════════════════════════════
   DUNGEON CARDS — background art, dark overlay, hover zoom
   ═══════════════════════════════════════════════════════════════════════════ */
.dung{position:relative;border-radius:8px;overflow:hidden;margin-bottom:12px;
  cursor:pointer;color:#fff;background:var(--ink2);isolation:isolate;
  transition:transform .3s cubic-bezier(.2,.7,.3,1),box-shadow .3s;
  border:1px solid transparent}
.dung:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.dung.push{border-color:var(--blue-hi);box-shadow:0 0 0 1px var(--blue-hi),0 8px 30px var(--blue-glow)}
.dung-art{position:absolute;inset:0;background-size:cover;background-position:center;
  transition:transform .6s cubic-bezier(.2,.7,.3,1);z-index:-1;
  filter:saturate(.9) brightness(.85)}
.dung:hover .dung-art{transform:scale(1.07)}
.dung-scrim{position:absolute;inset:0;z-index:-1;
  background:linear-gradient(175deg,rgba(12,12,15,.30) 0%,rgba(12,12,15,.86) 78%)}
.dung-pad{padding:14px 16px}
.dung-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.dung-id{font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:-.3px;
  text-shadow:0 1px 8px rgba(0,0,0,.6)}
.dung-name-full{font-size:10px;color:rgba(255,255,255,.65);margin-top:1px;
  text-shadow:0 1px 6px rgba(0,0,0,.6)}
.push-badge{font-size:9px;font-weight:800;letter-spacing:1px;color:#fff;
  background:var(--blue-hi);padding:3px 9px;text-transform:uppercase;
  border-radius:2px;flex-shrink:0;box-shadow:0 2px 12px var(--blue-glow)}
.dung-runs{display:flex;justify-content:space-between;align-items:flex-end;
  margin-top:22px;gap:8px}
.run-col .run-lbl{font-size:9px;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;color:rgba(255,255,255,.5)}
.run-col .run-val{font-family:var(--display);font-size:18px;font-weight:700;
  font-variant-numeric:tabular-nums;margin-top:2px;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.run-col .run-val small{font-size:11px;font-weight:600;margin-left:2px}
.run-timed .run-val{color:#7ee2a8}
.run-high .run-val{color:#9db2ff}
.run-high.depleted .run-val{color:rgba(255,255,255,.45)}
.run-score-col{font-size:12px;font-weight:600;color:rgba(255,255,255,.8);text-align:right}

.dung-detail{max-height:0;overflow:hidden;
  transition:max-height .35s ease,padding .35s ease}
.dung.open .dung-detail{max-height:560px;padding-top:12px;margin-top:12px;
  border-top:1px solid rgba(255,255,255,.14)}
.roster-title{font-size:9px;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;color:rgba(255,255,255,.5);margin:10px 0 4px}
.roster-row{display:flex;align-items:center;gap:8px;font-size:11px;padding:3px 0}
.roster-row.me .r-nm{color:#9db2ff;font-weight:800}
.r-ic{width:16px;text-align:center;flex-shrink:0;font-size:10px}
.r-nm{font-weight:600;color:#fff}
.r-sp{margin-left:auto;color:rgba(255,255,255,.55);font-size:10px;text-align:right}
.roster-loading{font-size:10px;color:rgba(255,255,255,.45);padding:8px 0 2px;
  display:flex;align-items:center;gap:6px}
.run-link{display:inline-block;margin-top:10px;font-size:10px;font-weight:700;
  letter-spacing:.5px;color:#9db2ff;text-decoration:none;
  border-bottom:1px solid rgba(157,178,255,.4);padding-bottom:1px;
  transition:color .2s,border-color .2s}
.run-link:hover{color:#fff;border-color:#fff}
.detail-row{display:flex;justify-content:space-between;gap:12px;
  font-size:11px;padding:3px 0}
.detail-row .dk{color:rgba(255,255,255,.5);font-weight:500}
.detail-row .dv{color:#fff;font-weight:600;text-align:right}
.affixes-row{font-size:10px;color:rgba(255,255,255,.55);padding-top:6px;line-height:1.6}

.empty-state{font-size:12px;color:var(--dim);padding:32px 0;text-align:center;
  border:1px dashed var(--border2);border-radius:8px}

/* ═══════════════════════════════════════════════════════════════════════════
   FOOTER
   ═══════════════════════════════════════════════════════════════════════════ */
.site-footer{background:var(--ink);color:rgba(255,255,255,.45);
  padding:36px 28px;text-align:center;font-size:12px}
.site-footer a{color:rgba(255,255,255,.7);text-decoration:none;
  border-bottom:1px solid rgba(255,255,255,.25);transition:color .2s}
.site-footer a:hover{color:#fff}

.spin{display:inline-block;width:10px;height:10px;border:1.5px solid rgba(127,127,140,.4);
  border-top-color:currentColor;border-radius:50%;animation:sp .7s linear infinite;
  vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}

@media(max-width:979px){
  .hero{min-height:64vh}
  .col-dung-l{order:2}.col-cutoffs{order:1}.col-dung-r{order:3}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;
    animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<nav id="nav">
  <div class="nav-inner">
    <a class="nav-logo" href="#">M<em>+</em> EU Cutoffs</a>
    <div class="nav-right">
      <div class="nav-season" id="navSeason">—</div>
      <div class="nav-status" id="navStatus"><span class="spin"></span> Loading</div>
    </div>
  </div>
</nav>

<header class="hero">
  <div class="hero-bg" id="heroBg"></div>
  <div class="hero-inner">
    <div class="hero-copy">
      <div class="hero-eyebrow">Mythic+ Season Tracker · Europe</div>
      <div class="hero-score" id="heroScore">—</div>
      <div class="hero-meta">
        <div class="hero-name" id="heroName">Loading character…</div>
        <div class="hero-rank" id="heroRank"></div>
      </div>
      <div class="hero-rule" id="heroRule"></div>
    </div>
    <div class="hero-avatar" id="heroAvatarWrap" style="display:none">
      <img id="heroAvatar" alt="Character portrait" referrerpolicy="no-referrer">
    </div>
  </div>
  <div class="hero-scroll">Scroll</div>
</header>

<div class="lookup-band">
  <div class="lookup-inner">
    <span class="lookup-label">Character</span>
    <input id="nameInput" placeholder="Name" autocomplete="off" autocapitalize="off">
    <input id="realmInput" placeholder="Realm" autocomplete="off" autocapitalize="off">
    <button class="lookup-btn" id="lookupBtn">Look up</button>
  </div>
</div>

<div class="main">
  <div class="grid-3">
    <div class="col-dung-l col-sticky reveal">
      <div class="sec-label">Weakest <small>push these</small></div>
      <div id="dungLeft"><div class="empty-state">—</div></div>
    </div>
    <div class="col-cutoffs">
      <div class="sec-label reveal">Percentile cutoffs <small>live · EU</small></div>
      <div id="cutsPct"></div>
      <div class="sec-label reveal" style="margin-top:32px">Achievement thresholds</div>
      <div id="cutsFixed"></div>
    </div>
    <div class="col-dung-r col-sticky reveal">
      <div class="sec-label">Strongest</div>
      <div id="dungRight"><div class="empty-state">—</div></div>
    </div>
  </div>
</div>

<footer class="site-footer">
  Data provided by <a href="https://raider.io" target="_blank" rel="noopener">Raider.IO</a>
  &nbsp;·&nbsp; Not affiliated with Blizzard Entertainment
</footer>

<script>
const REGION="eu", DEFAULT_NAME="Memfx", DEFAULT_REALM="ragnaros";
const SEASONS=["season-mn-1","season-tww-3","season-tww-2"];
const TIERS=[
  {label:"All Stars",key:"p999",kind:"pct",sub:"Top 0.1% · Seasonal title",target:true,col:"var(--gold)"},
  {label:"Top 1%",key:"p990",kind:"pct",sub:"Top 1%",target:true,col:"var(--pink)"},
  {label:"Top 10%",key:"p900",kind:"pct",sub:"Top 10%",target:false,col:"var(--purple)"},
  {label:"Keystone Myth",key:"keystoneMyth",kind:"fixed",sub:"Fixed score threshold",target:false,col:"var(--red)"},
  {label:"Keystone Legend",key:"keystoneLegend",kind:"fixed",sub:"Fixed score threshold",target:false,col:"var(--orange)"},
  {label:"Keystone Hero",key:"keystoneHero",kind:"fixed",sub:"Fixed score threshold",target:false,col:"var(--blue)"},
  {label:"Keystone Master",key:"keystoneMaster",kind:"fixed",sub:"Fixed score threshold",target:false,col:"var(--green)"},
  {label:"Keystone Conqueror",key:"keystoneConqueror",kind:"fixed",sub:"Fixed score threshold",target:false,col:"var(--lime)"},
];
let cutoffScores={}, charScore=null;
const $=id=>document.getElementById(id);

function mmss(ms){if(ms==null)return"—";const s=Math.floor(ms/1000);
  return`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`}
function pips(n){return n===0?"✗":n===1?"+":n===2?"++":"+++"}
function relDate(iso){if(!iso)return"—";
  try{const d=new Date(iso),now=new Date(),days=Math.floor((now-d)/864e5);
    if(days<=0){const h=Math.floor((now-d)/36e5);
      return h<=0?"just now":h===1?"1 hour ago":`${h} hours ago`}
    if(days===1)return"yesterday";if(days<7)return`${days} days ago`;
    return d.toLocaleDateString(undefined,{day:"2-digit",month:"short",year:"numeric"})
  }catch(e){return iso.slice(0,10)}}
function setStatus(msg,spin=false){
  $("navStatus").innerHTML=(spin?'<span class="spin"></span> ':'')+msg}

/* ── Nav solid on scroll ── */
const nav=$("nav");
function onScroll(){nav.classList.toggle("solid",window.scrollY>40)}
window.addEventListener("scroll",onScroll,{passive:true});onScroll();

/* ── Scroll reveal ── */
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}
}),{threshold:.12});
function observeReveals(){document.querySelectorAll(".reveal:not(.in)").forEach(el=>io.observe(el))}
observeReveals();

/* ── Cutoff cards ── */
function buildCutoffCards(){
  $("cutsPct").innerHTML=TIERS.filter(t=>t.kind==="pct").map(cardHTML).join("");
  $("cutsFixed").innerHTML=TIERS.filter(t=>t.kind==="fixed").map(cardHTML).join("");
  observeReveals();
}
function cardHTML(t){
  return`<div class="card reveal" id="card-${t.key}">
    <div class="card-stripe"></div>
    <div class="card-body">
      <div><div class="card-label" style="color:${t.col}">${t.label}</div>
        <div class="card-sub">${t.sub}</div></div>
      <div class="card-right">
        <div class="card-val" id="cut-${t.key}">0000</div>
        <div class="card-gap" id="gap-${t.key}"></div></div>
    </div>
    ${t.target?`<div class="bar-wrap">
      <div class="bar-track"><div class="bar-fill" id="bar-${t.key}"></div></div>
      <div class="bar-meta"><span id="bar-lbl-${t.key}"></span><span id="pct-${t.key}"></span></div>
    </div>`:""}
  </div>`;
}

/* ── Fetch cutoffs ── */
async function fetchCutoffs(){
  for(const slug of SEASONS){
    try{
      const r=await fetch(`https://raider.io/api/v1/mythic-plus/season-cutoffs?season=${slug}&region=${REGION}`);
      if(r.status===404)continue;
      if(!r.ok)throw new Error("HTTP "+r.status);
      applyCutoffs(await r.json(),slug);return;
    }catch(e){setStatus("Cutoffs unavailable");return}
  }
  setStatus("No active season found");
}
function applyCutoffs(data,slug){
  const cutoffs=data.cutoffs||{};
  $("navSeason").textContent=slug;
  TIERS.forEach(t=>{
    const entry=cutoffs[t.key];if(!entry)return;
    const val=t.kind==="fixed"?entry.score:(entry.all&&entry.all.quantileMinValue);
    if(val!=null){
      cutoffScores[t.key]=val;
      const el=$("cut-"+t.key);
      el.textContent=Math.round(val).toLocaleString();
      el.classList.add("loaded");el.style.color=t.col;
    }
  });
  const up=cutoffs.updatedAt;
  setStatus(up?("Updated "+new Date(up).toLocaleString()):"Loaded");
  updateGaps();
}

/* ── Fetch character ── */
async function fetchChar(){
  const name=$("nameInput").value.trim()||DEFAULT_NAME;
  const realm=($("realmInput").value.trim()||DEFAULT_REALM).toLowerCase();
  setStatus("Looking up "+name+"…",true);
  $("heroScore").textContent="—";$("heroName").textContent="Loading…";$("heroRank").textContent="";
  const fields="mythic_plus_scores_by_season:current,mythic_plus_ranks,mythic_plus_best_runs,mythic_plus_highest_level_runs";
  try{
    const r=await fetch(`https://raider.io/api/v1/characters/profile?region=${REGION}&realm=${realm}&name=${encodeURIComponent(name)}&fields=${fields}`);
    if(r.status===400||r.status===404){
      $("heroName").textContent="Character not found";
      setStatus("Check name and realm, then try again");return}
    if(!r.ok)throw new Error("HTTP "+r.status);
    applyChar(await r.json(),name);
  }catch(e){setStatus("Network error — "+e.message)}
}
function applyChar(data,name){
  const list=data.mythic_plus_scores_by_season||[];
  let score=null;
  for(const s of list){const v=s.scores&&s.scores.all;if(v){score=v;break}}
  const ranks=data.mythic_plus_ranks||{};
  const rank=ranks.overall&&ranks.overall.realm;
  charScore=score!=null?score:null;
  $("heroName").textContent=name;
  $("heroRank").textContent=rank?("Realm rank #"+rank):"";
  if(charScore!=null){
    animateNumber($("heroScore"),charScore);
    requestAnimationFrame(()=>{$("heroRule").style.width="150px"});
  }else{$("heroScore").textContent="No data"}

  /* avatar — try larger renders first, fall back to thumbnail, then initial */
  const wrap=$("heroAvatarWrap"), img=$("heroAvatar");
  console.log("thumbnail_url:",data.thumbnail_url);   // debug
  if(data.thumbnail_url){
    const candidates=[
      data.thumbnail_url.replace("-avatar.jpg","-main.jpg"),
      data.thumbnail_url.replace("-avatar.jpg","-inset.jpg"),
      data.thumbnail_url
    ].filter((v,i,a)=>a.indexOf(v)===i);
    let idx=0;
    img.onerror=()=>{
      console.warn("avatar candidate failed:",candidates[idx]);
      idx++;
      if(idx<candidates.length){ img.src=candidates[idx]; }
      else { img.onerror=null; showAvatarFallback(name); }
    };
    img.style.display="";
    img.src=candidates[0];
    wrap.style.display="";
  } else {
    showAvatarFallback(name);
  }

  buildDungeons(data.mythic_plus_best_runs||[],data.mythic_plus_highest_level_runs||[]);
  updateGaps();
}

/* ── Gaps + bars ── */
function showAvatarFallback(name){
  const wrap=$("heroAvatarWrap"), img=$("heroAvatar");
  img.style.display="none";
  let ph=wrap.querySelector(".avatar-ph");
  if(!ph){
    ph=document.createElement("div");
    ph.className="avatar-ph";
    wrap.insertBefore(ph,img);
  }
  ph.textContent=(name||"?").charAt(0).toUpperCase();
  wrap.style.display="";
}

function updateGaps(){
  if(!Object.keys(cutoffScores).length)return;
  TIERS.forEach(t=>{
    const cut=cutoffScores[t.key];if(cut==null)return;
    const card=$("card-"+t.key),gap=$("gap-"+t.key);
    if(!card||!gap)return;
    if(charScore==null){gap.textContent="";return}
    const diff=cut-charScore;
    if(diff<=0){gap.textContent="✓ achieved";gap.className="card-gap done";card.classList.add("achieved")}
    else{gap.textContent="−"+Math.round(diff).toLocaleString()+" pts to go";
      gap.className="card-gap";card.classList.remove("achieved")}
    if(t.target){
      const base=Math.max(0,cut-1500),span=cut-base;
      const frac=span>0?Math.max(0,Math.min(1,(charScore-base)/span)):0;
      const b=$("bar-"+t.key);if(b)b.style.width=(frac*100)+"%";
      const p=$("pct-"+t.key);if(p)p.textContent=Math.round(frac*100)+"%";
      const l=$("bar-lbl-"+t.key);
      if(l)l.textContent=diff>0?`${Math.round(charScore).toLocaleString()} / ${Math.round(cut).toLocaleString()}`:"Achieved";
    }
  });
}

/* ── Dungeons with background art ── */
let heroBgSet=false;
function buildDungeons(best,high){
  const highByName={};high.forEach(r=>highByName[r.dungeon]=r);
  let dungeons=best.map(r=>{
    const hr=highByName[r.dungeon]||{};
    return{name:r.dungeon,short:r.short_name||"??",
      bestLevel:r.mythic_level,bestPips:r.num_keystone_upgrades,bestScore:r.score||0,
      highLevel:hr.mythic_level||r.mythic_level,
      highPips:hr.num_keystone_upgrades??r.num_keystone_upgrades,
      score:r.score||0,bestRaw:r,highRaw:hr,push:false,
      art:r.background_image_url||hr.background_image_url||""};
  });
  if(!dungeons.length){
    dungeons=high.map(r=>({name:r.dungeon,short:r.short_name||"??",
      bestLevel:null,bestPips:0,bestScore:0,
      highLevel:r.mythic_level,highPips:r.num_keystone_upgrades,
      score:0,bestRaw:{},highRaw:r,push:false,art:r.background_image_url||""}));
  }
  dungeons.sort((a,b)=>a.score-b.score);
  dungeons.slice(0,2).forEach(d=>d.push=true);

  /* hero background = your weakest dungeon's art (the one to conquer) */
  if(!heroBgSet&&dungeons.length&&dungeons[0].art){
    const bg=$("heroBg");
    const img=new Image();
    img.onload=()=>{bg.style.backgroundImage=`url('${dungeons[0].art}')`;bg.classList.add("on")};
    img.src=dungeons[0].art;
    heroBgSet=true;
  }

  const left=dungeons.slice(0,4),right=dungeons.slice(4);
  $("dungLeft").innerHTML=left.length?left.map(dungHTML).join(""):'<div class="empty-state">No runs yet</div>';
  $("dungRight").innerHTML=right.length?right.map(dungHTML).join(""):'<div class="empty-state">No runs yet</div>';
  document.querySelectorAll(".dung").forEach(el=>{
    el.addEventListener("click",()=>{
      el.classList.toggle("open");
      if(el.classList.contains("open")) loadRoster(el);
    })});
  observeReveals();
}

/* ── Lazy roster fetch (party members) ── */
const rosterCache={};
async function loadRoster(cardEl){
  const box=cardEl.querySelector(".roster");
  if(!box||box.dataset.done)return;
  const runId=box.dataset.runid;
  const runUrl=box.dataset.runurl||"";
  if(!runId){box.dataset.done="1";return}
  box.dataset.done="1";

  // season slug is embedded in the run url: /mythic-plus-runs/<season>/<id>-...
  let season=$("navSeason").textContent||"";
  const m=runUrl.match(/mythic-plus-runs\/([^/]+)\//);
  if(m)season=m[1];

  box.innerHTML='<div class="roster-loading"><span class="spin"></span> Loading party…</div>';

  if(rosterCache[runId]){renderRoster(box,rosterCache[runId]);return}
  try{
    const r=await fetch(`https://raider.io/api/v1/mythic-plus/run-details?season=${season}&id=${runId}`);
    if(!r.ok){
      box.innerHTML=`<div class="roster-loading">Party unavailable (HTTP ${r.status})</div>`;
      console.warn("run-details HTTP",r.status,"for",runId,season);
      return;
    }
    const data=await r.json();
    console.log("run-details response for",runId,data);   // debug: full shape
    if(!Array.isArray(data.roster)){
      box.innerHTML=`<div class="roster-loading">Party unavailable (no roster; keys: ${Object.keys(data).slice(0,8).join(", ")})</div>`;
      return;
    }
    const roster=data.roster.map(m=>{
      const ch=m.character||m||{};
      const nm=ch.name||"?";
      const cls=(ch.class&&ch.class.name)||"";
      const sp=(ch.spec&&ch.spec.name)||"";
      const rl=m.role||(ch.spec&&ch.spec.role)||"";
      const realm=(ch.realm&&(ch.realm.name||ch.realm.slug))||"";
      return{name:nm,cls,spec:sp,role:rl,realm};
    });
    rosterCache[runId]=roster;
    renderRoster(box,roster);
  }catch(e){
    box.innerHTML=`<div class="roster-loading">Party unavailable (${e.message})</div>`;
    console.warn("run-details failed:",e);
  }
}
function roleIcon(r){
  return r==="tank"?"🛡":r==="healer"?"✚":"⚔";
}
function renderRoster(box,roster){
  if(!roster.length){box.innerHTML='<div class="roster-loading">Party unavailable</div>';return}
  const me=($("nameInput").value.trim()||DEFAULT_NAME).toLowerCase();
  box.innerHTML='<div class="roster-title">Party</div>'+roster.map(p=>{
    const isMe=p.name.toLowerCase()===me;
    return`<div class="roster-row${isMe?' me':''}">
      <span class="r-ic">${roleIcon(p.role)}</span>
      <span class="r-nm">${p.name}${isMe?" (you)":""}</span>
      <span class="r-sp">${p.spec}${p.spec&&p.cls?" ":""}${p.cls}</span>
    </div>`;
  }).join("");
}
function dungHTML(d){
  const b=d.bestRaw||{},h=d.highRaw||{};
  const ct=b.clear_time_ms,par=b.par_time_ms;
  let timeLine="";
  if(ct&&par){const diff=par-ct;
    timeLine=`${mmss(ct)} / par ${mmss(par)} (${mmss(Math.abs(diff))} ${diff>=0?"under":"over"})`}
  const affixes=(b.affixes||h.affixes||[]).map(a=>a.name).join(" · ");
  const spec=(b.spec&&b.spec.name)||"";
  const role=b.role||(b.spec&&b.spec.role)||"";
  const depleted=d.highPips===0;
  const showHigh=d.highLevel&&(d.highLevel!==d.bestLevel||d.highPips!==d.bestPips);
  return`<div class="dung reveal ${d.push?"push":""}">
    <div class="dung-art" style="background-image:url('${d.art}')"></div>
    <div class="dung-scrim"></div>
    <div class="dung-pad">
      <div class="dung-head">
        <div><div class="dung-id">${d.short}</div>
          <div class="dung-name-full">${d.name}</div></div>
        ${d.push?'<span class="push-badge">↑ Push</span>':''}
      </div>
      <div class="dung-runs">
        <div class="run-col run-timed"><div class="run-lbl">Timed</div>
          <div class="run-val">${d.bestLevel?"+"+d.bestLevel:"—"}<small>${d.bestLevel?pips(d.bestPips):""}</small></div></div>
        <div class="run-col run-high ${depleted?'depleted':''}"><div class="run-lbl">Highest</div>
          <div class="run-val">${d.highLevel?"+"+d.highLevel:"—"}<small>${d.highLevel?pips(d.highPips):""}</small></div></div>
        <div class="run-score-col">${d.bestScore?d.bestScore.toFixed(1)+" pts":""}</div>
      </div>
      <div class="dung-detail">
        ${timeLine?`<div class="detail-row"><span class="dk">Clear time</span><span class="dv">${timeLine}</span></div>`:""}
        ${b.completed_at?`<div class="detail-row"><span class="dk">Completed</span><span class="dv">${relDate(b.completed_at)}</span></div>`:""}
        ${spec||role?`<div class="detail-row"><span class="dk">Played as</span><span class="dv">${spec}${role?" ("+role+")":""}</span></div>`:""}
        ${showHigh?`<div class="detail-row"><span class="dk">Highest key</span><span class="dv">+${d.highLevel} ${depleted?"(depleted)":pips(d.highPips)}</span></div>`:""}
        ${affixes?`<div class="affixes-row">${affixes}</div>`:""}
        <div class="roster" data-runid="${b.keystone_run_id||""}" data-runurl="${b.url||""}"></div>
        ${b.url?`<a class="run-link" href="${b.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">View run on Raider.IO ↗</a>`:""}
      </div>
    </div>
  </div>`;
}

/* ── Score count-up ── */
function animateNumber(el,target){
  const dur=900,start=performance.now();
  function frame(now){
    const t=Math.min((now-start)/dur,1),e=1-Math.pow(1-t,3);
    el.textContent=(target*e).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
    if(t<1)requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* ── Init ── */
$("nameInput").value=DEFAULT_NAME;
$("realmInput").value=DEFAULT_REALM;
$("lookupBtn").addEventListener("click",fetchChar);
$("nameInput").addEventListener("keydown",e=>{if(e.key==="Enter")fetchChar()});
$("realmInput").addEventListener("keydown",e=>{if(e.key==="Enter")fetchChar()});
buildCutoffCards();
fetchCutoffs();
fetchChar();
</script>
</body>
